mutation applyMarketingCoupon($input: ApplyMarketingCouponInput!) {
  applyMarketingCoupon(input: $input) {
    couponId
    # 할인 정보
    discount {
      type
      value
    }
    # 쿠폰 이름
    name
    # 유효기간 - 시작 시간
    startTime
    # 유효기간 - 종료 시간
    endTime
    # 발급대상
    # issuerTargetType
    # 최소 주문 금액
    minOrderPrice {
      amount
      currencyType
    }
    # 최대 할인 금액
    maxDiscountPrice {
      amount
      currencyType
    }
    # 할인 범위
    scopeType
  }
}

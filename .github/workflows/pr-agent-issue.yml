name: PR Agent - Issue Analysis

on:
  # 자동: 이슈 생성 시
  issues:
    types: [opened]

  # 자동: 이슈 댓글에 /analyze 또는 /재분석 포함 시
  issue_comment:
    types: [created]

  # 수동: 특정 이슈 분석 요청
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze'
        required: true
        type: number

jobs:
  issue-analysis:
    runs-on: ubuntu-latest
    # issue_comment은 PR 댓글에도 트리거되므로, PR이 아닌 이슈만 필터
    if: >
      github.event_name == 'issues' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       !contains(github.event.comment.body, 'Generated by PR-Agent') &&
       (contains(github.event.comment.body, '/analyze') ||
        contains(github.event.comment.body, '/재분석') ||
        contains(github.event.comment.body, '/review')))
    steps:
      - name: Set issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Analyze Issue
        run: |
          curl -sf -X POST "${{ secrets.PR_AGENT_ENDPOINT }}/issue" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.PR_AGENT_API_KEY }}" \
            -H "x-github-token: ${{ secrets.GH_TOKEN }}" \
            -d '{
              "issueNumber": ${{ steps.issue.outputs.number }},
              "repoName": "${{ github.repository }}"
            }'
